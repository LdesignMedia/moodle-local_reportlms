<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Report LMS">
  <title>Report LMS</title>
  <defs>
    <linearGradient id="reportlmsRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA9147"/>
      <stop offset="100%" stop-color="#FA6E10"/>
    </linearGradient>
  </defs>

  <!--
    A gauge that has swept almost the whole way round, and the bars it swept
    over. The ring opens at the top rather than the bottom so the two ends read
    as a measurement in progress instead of a closed pie: this product reports
    on training that is still running, not on a finished year.

    The head of the sweep sits directly above the tallest bar. That alignment is
    the whole idea of the mark, so it survives any resizing: the measure points
    at the thing it measured.
  -->
  <path d="M45 22.1 A46 46 0 1 0 83 22.1"
        fill="none" stroke="url(#reportlmsRing)" stroke-width="12" stroke-linecap="round"/>

  <circle cx="83" cy="22.1" r="9" fill="#DC5304"/>

  <!-- Three bars, ascending, in the same three tones as the ring family. -->
  <rect x="38.5" y="66" width="13" height="24" rx="6.5" fill="#FA9147"/>
  <rect x="57.5" y="52" width="13" height="38" rx="6.5" fill="#FA6E10"/>
  <rect x="76.5" y="38" width="13" height="52" rx="6.5" fill="#DC5304"/>
</svg>
