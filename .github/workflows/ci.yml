name: ci

on: [push, pull_request]

jobs:
  ci:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # No tests/behat directory. The surfaces worth driving through a browser
      # are the dashboard block and the embedded report, and both need a
      # connected Report LMS environment that CI has no way to reach.
      disable_behat: true
      # No Gruntfile.js and no package.json. The one AMD module is built with
      # the moodle CLI in Docker rather than in CI, so the catalyst grunt runner
      # fails with "Unable to find local grunt".
      disable_grunt: true
      # The plugin requires Moodle 4.5 and supports 4.5 to 5.1: exactly the
      # versions tested here.
      min_php: 8.1
      moodle_branches: MOODLE_405_STABLE MOODLE_500_STABLE MOODLE_501_STABLE
      # amd/build is generated.
      ignore_paths: amd/build,vendor,node_modules
